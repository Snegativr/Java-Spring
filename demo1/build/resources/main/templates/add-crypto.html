<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>add</title>
</head>
<body>
<h2>Add new crypto</h2>
<form th:action="@{/crypto/add}" th:object="${crypto}" method="POST">
    <input placeholder="Crypto" th:field="*{crypto}" type="text">
    <span style="color: red" th:if="${#fields.hasErrors('crypto')}" th:errors="*{crypto}"></span>

    <input type="text" th:field="*{price}" placeholder="Price" >
    <span style="color: red" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>

    <button type="submit">Add</button>
</form>
</body>
</html>
